# Scrape metrik linkerd-proxy (port linkerd-admin) di semua namespace
# oleh Prometheus kube-prometheus-stack (label release: monitoring).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: linkerd-proxy
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
    - key: linkerd.io/control-plane-ns
      operator: Exists
  podMetricsEndpoints:
  - port: linkerd-admin
    path: /metrics
    interval: 5s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_label_app]
      targetLabel: app
